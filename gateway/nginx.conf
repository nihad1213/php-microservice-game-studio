server {
    listen 85;

    resolver 127.0.0.11 valid=10s;

    location /api/v1/developers {
        proxy_pass http://developer-service;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /api/v1/teams {
        proxy_pass http://team-service;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /api/v1/games {
        proxy_pass http://game-service;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /api/v1/sales {
        proxy_pass http://sales-service;
        include /etc/nginx/conf.d/proxy.inc;
    }
}